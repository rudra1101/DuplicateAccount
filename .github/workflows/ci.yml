name: IdentityAI CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identityai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend + PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: identityai_ci
          POSTGRES_USER: identityai
          POSTGRES_PASSWORD: identityai-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identityai -d identityai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://identityai:identityai-ci-password@127.0.0.1:5432/identityai_ci
      AUTH_SECRET_KEY: identityai-ci-auth-secret-key-with-more-than-32-characters
      APP_ENV: development
      AUTH_COOKIE_SECURE: "false"
      RUN_RUDRIX_LIVE_TESTS: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply Alembic migrations
        run: python -m alembic upgrade head

      - name: Run Phase 13 and PostgreSQL runtime tests
        run: >-
          python -m pytest
          tests/test_observability.py
          tests/test_runtime_config.py
          tests/test_database_runtime_config.py
          tests/test_postgresql_runtime.py
          -v --tb=short

      - name: Run Rudrix fast regression tests
        run: python -m pytest tests/rudrix -m "not rudrix_live" -v --tb=short

  frontend-quality:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  container-builds:
    name: Compose + monitoring + container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-tests
      - frontend-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create temporary CI environment file
        run: |
          cat > backend/.env <<'EOF'
          POSTGRES_DB=identityai_ci
          POSTGRES_USER=identityai
          POSTGRES_PASSWORD=identityai-ci-password
          APP_ENV=development
          AUTH_SECRET_KEY=identityai-ci-auth-secret-key-with-more-than-32-characters
          ALLOWED_HOSTS=localhost,127.0.0.1,backend,testserver
          CORS_ORIGINS=
          AUTH_COOKIE_SECURE=false
          AUTH_COOKIE_SAMESITE=lax
          SECURITY_HEADERS_ENABLED=true
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose --env-file backend/.env --profile monitoring config --quiet

      - name: Validate Prometheus configuration and alert rules
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "$PWD/ops/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.5.0
          check config /etc/prometheus/prometheus.yml

      - name: Build backend container
        run: docker build -t identityai-backend:ci ./backend

      - name: Build frontend container
        run: docker build --build-arg VITE_API_BASE_URL=/api -t identityai-frontend:ci ./frontend
